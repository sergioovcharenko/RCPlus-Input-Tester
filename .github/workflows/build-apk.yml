name: Build RC Plus Input Tester APK
on:
  workflow_dispatch:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - run: sdkmanager --install 'platforms;android-35' 'build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.12'
      - name: Check DJI App Key
        env:
          DJI_APP_KEY: ${{ secrets.DJI_APP_KEY }}
        run: |
          if [ -z "$DJI_APP_KEY" ]; then
            echo 'DJI_APP_KEY not set. Add repository secret at Settings > Secrets and variables > Actions.' >&2
            exit 1
          fi
      - name: Build APK
        env:
          DJI_APP_KEY: ${{ secrets.DJI_APP_KEY }}
        run: gradle --no-daemon --stacktrace assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: RCPlus-Input-Tester-0.3-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
