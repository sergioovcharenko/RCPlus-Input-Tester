name: Build RC Plus Input Tester APK
on:
  workflow_dispatch:
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: rcplus-android-build
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      DJI_APP_KEY: ${{ secrets.DJI_APP_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Android build components
        shell: bash
        run: |
          SDKROOT="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          SDKMANAGER=$(find "$SDKROOT/cmdline-tools" -type f -name sdkmanager | sort -V | tail -n 1)
          if [ -z "$SDKMANAGER" ]; then echo "Android sdkmanager is missing from runner" >&2; exit 1; fi
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" --install 'platforms;android-35' 'build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.12'
      - name: Compile Android app
        shell: bash
        run: |
          # Use a clearly invalid placeholder only to check compilation when the repository
          # secret is not set. Never distribute placeholder builds as registered DJI apps.
          if [ -z "$DJI_APP_KEY" ]; then
            echo 'DJI_APP_KEY not configured. Running compile check only; no APK artifact will be published.'
            export DJI_APP_KEY=00000000000000000000000000000000
          fi
          gradle --no-daemon --stacktrace assembleDebug
      - name: Confirm AndroidX ActivityCompat included in APK
        shell: bash
        run: |
          python3 - <<'PY'
          import zipfile
          apk = 'app/build/outputs/apk/debug/app-debug.apk'
          with zipfile.ZipFile(apk) as z:
              dex_files = [n for n in z.namelist() if n.startswith('classes') and n.endswith('.dex')]
              found = any(b'Landroidx/core/app/ActivityCompat;' in z.read(n) for n in dex_files)
              print('Dex files:', len(dex_files))
              print('AndroidX ActivityCompat packaged:', found)
              if not found:
                  raise SystemExit('SDK required AndroidX ActivityCompat is missing from built APK')
          PY
      - name: Upload registered APK
        if: ${{ env.DJI_APP_KEY != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: RCPlus-Input-Tester-0.3.3-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
