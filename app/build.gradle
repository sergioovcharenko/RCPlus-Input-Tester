plugins { id 'com.android.application' }

def djiKey = providers.environmentVariable('DJI_APP_KEY').orElse(providers.gradleProperty('DJI_APP_KEY')).orElse('').get().trim()
if (!djiKey) throw new GradleException('DJI_APP_KEY is missing; configure the GitHub Actions repository secret')

android {
    namespace 'com.serhii.rcplustester'
    compileSdk 35
    defaultConfig {
        applicationId 'com.serhii.rcplustester'
        minSdk 24
        targetSdk 32
        versionCode 11
        versionName '0.4.0-bridge03'
        ndk { abiFilters 'arm64-v8a' }
        manifestPlaceholders = [djiApiKey: djiKey]
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    packaging {
        jniLibs {
            pickFirsts += ['**/libc++_shared.so']
        }
    }
}
// DJI libraries and AndroidX may pull mixed Kotlin 1.6/1.8 stdlib modules.
// Use one coherent version to prevent duplicate kotlin.* classes.
configurations.configureEach {
    resolutionStrategy.force(
        'org.jetbrains.kotlin:kotlin-stdlib:1.8.22',
        'org.jetbrains.kotlin:kotlin-stdlib-jdk7:1.8.22',
        'org.jetbrains.kotlin:kotlin-stdlib-jdk8:1.8.22'
    )
}

dependencies {
    // MSDK 5.18.0 references ActivityCompat from AndroidX at runtime.
    implementation 'androidx.core:core:1.13.1'
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'com.google.android.material:material:1.8.0'
    implementation 'com.dji:dji-sdk-v5-aircraft:5.18.0'
    compileOnly 'com.dji:dji-sdk-v5-aircraft-provided:5.18.0'
    runtimeOnly 'com.dji:dji-sdk-v5-networkImp:5.18.0'
}
